<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Ano Live2D</title>
<style>
  html, body { margin:0; height:100%; background:#0d1420; overflow:hidden; }
  #stage { position:fixed; inset:0; }
  #msg { position:fixed; inset:0; display:none; place-content:center; align-items:center;
         color:#9fb0c4; font:14px/1.9 system-ui, sans-serif; text-align:center; padding:0 24px; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="msg"></div>

<script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js"></script>
<script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>
<script>
const MODELS = {
  haru:    'https://cdn.jsdelivr.net/gh/guansss/pixi-live2d-display@master/test/assets/haru/haru_greeter_t03.model3.json',
  shizuku: 'https://cdn.jsdelivr.net/gh/guansss/pixi-live2d-display@master/test/assets/shizuku/shizuku.model.json',
  local:   '/live2d/model/model.model3.json'
};
const PICK = new URLSearchParams(location.search).get('m') || 'haru';
const MODEL_URL = MODELS[PICK] || MODELS.haru;
const stage = document.getElementById('stage');
const msg = document.getElementById('msg');
function say(h){ msg.innerHTML = h; msg.style.display='grid'; }
let model = null, app = null;
const state = { mouth: 0 };
function boot(){
  if (typeof PIXI === 'undefined') { say('pixi load failed'); return; }
  if (!PIXI.live2d) { say('live2d plugin load failed'); return; }
  app = new PIXI.Application({ backgroundAlpha:0, resizeTo:window, antialias:true });
  stage.appendChild(app.view);
  PIXI.live2d.Live2DModel.from(MODEL_URL, { autoInteract:false }).then(function(m){
    model = m;
    app.stage.addChild(model);
    // 用模型自身尺寸当基准，别用缩放后的，否则每次缩放都会滚雪球
    const bw = model.internalModel.width, bh = model.internalModel.height;
    const fit = function(){
      const s = Math.min(app.screen.width / bw, (app.screen.height * 0.92) / bh);
      model.scale.set(s);
      model.anchor.set(0.5, 1);
      model.x = app.screen.width / 2;
      model.y = app.screen.height;
    };
    fit(); window.addEventListener('resize', fit);
    try { model.motion('Idle'); } catch(e){}
    msg.style.display='none';
    tick();
  }).catch(function(e){
    say('loading failed: ' + PICK + '<br><small>' + (e && e.message ? e.message : e) + '</small><br><br>available: ' + Object.keys(MODELS).join(' / ') + '<br>add ?m=name');
  });
}
function tick(){
  const core = model && model.internalModel && model.internalModel.coreModel;
  if (core) { try {
    const cur = core.getParameterValueById('ParamMouthOpenY') || 0;
    core.setParameterValueById('ParamMouthOpenY', cur + (state.mouth - cur)*0.35);
  } catch(e){} }
  requestAnimationFrame(tick);
}
window.ano = {
  mouth: function(v){ state.mouth = Math.max(0, Math.min(1, Number(v)||0)); },
  expression: function(n){ if (model && n){ try{ model.expression(n); }catch(e){} } },
  motion: function(n){ if (model && n){ try{ model.motion(n); }catch(e){} } },
  playEnvelope: function(list, ms){ ms = ms||100; let i=0;
    const t = setInterval(function(){ if(i>=list.length){ clearInterval(t); window.ano.mouth(0); return;} window.ano.mouth(list[i++]); }, ms); }
};
setInterval(function(){ if(model) window.ano.mouth(0.5 + 0.5*Math.sin(Date.now()/330)); }, 60);
boot();
</script>
</body>
</html>
